tempo:
  retention: 72h

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-server.observability.svc.cluster.local:80/api/v1/write"
    processor:
      span_metrics:
        enable_target_info: true
      service_graphs:
        wait: 10s

  # Sem isso, metricsGenerator.enabled sozinho renderiza o bloco de config
  # mas com processors vazio (não faz nada). Este é o switch que ativa os
  # dois processors de fato.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          # Necessário para consultas TraceQL metrics no Traces Drilldown.
          - local-blocks

  # Com 1Gi o heap saturava o limite sob a carga de consultas TraceQL metrics
  # do Traces Drilldown (RSS ~1Gi), o processo travava e a liveness matava o pod.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  # Mais tolerante que o default (timeout 5s / 3 falhas): uma pausa de GC ou
  # uma rajada de consultas não deve virar kill, que ainda corrompe blocos do
  # generator na WAL. Só timeoutSeconds e failureThreshold mudam; o resto é
  # mesclado com o default do chart. A readiness segue no default: falhar nela
  # só tira o pod do Service, não o reinicia.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6

persistence:
  enabled: true
  storageClassName: longhorn-fast
  size: 10Gi

serviceMonitor:
  enabled: false
