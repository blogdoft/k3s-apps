apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    helm.sh/chart: opentelemetry-collector-0.172.1
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/version: "0.159.0"
