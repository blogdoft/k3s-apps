apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: "Observability"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  logs-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Log Volume by Namespace",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (namespace) (count_over_time({namespace=~\".+\"}[$__interval]))",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error-pattern Rate by Namespace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (namespace) (count_over_time({namespace=~\".+\"} |~ \"(?i)error|exception|panic\" [$__interval]))",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Top 10 Pods by Log Volume",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "topk(10, sum by (pod) (count_over_time({namespace=~\".+\"}[$__interval])))",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {}
        },
        {
          "id": 4,
          "type": "text",
          "title": "Nota",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "options": {
            "mode": "markdown",
            "content": "**Reinícios de pod**: essa métrica vem tipicamente do `kube-state-metrics`, que não faz parte deste stack (fora de escopo — só logs via Loki/Alloy e traces/RED via Tempo/Prometheus). O painel \"Top 10 Pods by Log Volume\" ao lado serve como substituto aproximado: picos de volume de log por pod costumam coincidir com crashloops/restarts."
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["observability", "logs"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Logs Overview",
      "uid": "logs-overview",
      "version": 1,
      "weekStart": ""
    }
  apm-service-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error Rate %",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 * sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"$service\", status_code=\"STATUS_CODE_ERROR\"}[5m])) / sum by (service) (rate(traces_spanmetrics_calls_total{service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency P95 / P99",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\"}[5m])))",
              "legendFormat": "p95 {{service}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\"}[5m])))",
              "legendFormat": "p99 {{service}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 4,
          "type": "text",
          "title": "Mapa de serviços",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 16 },
          "options": {
            "mode": "markdown",
            "content": "Para o mapa de dependências entre serviços (service graph), use a aba **Node Graph** do datasource Tempo em **Explore** — não reconstruído aqui como painel estático."
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["observability", "apm"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(traces_spanmetrics_calls_total, service)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": {
              "query": "label_values(traces_spanmetrics_calls_total, service)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "APM / Service Overview",
      "uid": "apm-service-overview",
      "version": 1,
      "weekStart": ""
    }
  host-pod-stats.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Host",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU Usage by Node",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "options": {}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory Usage by Node",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "options": {}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Disk Usage by Node",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - ((node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"}) * 100)",
              "legendFormat": "{{instance}} {{mountpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "options": {}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Network Traffic by Node",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|docker.*|cni.*\"}[5m]))",
              "legendFormat": "{{instance}} rx",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|docker.*|cni.*\"}[5m]))",
              "legendFormat": "{{instance}} tx",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Node Load Average (1m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "node_load1",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": { "graphMode": "area" }
        },
        {
          "id": 7,
          "type": "row",
          "title": "Pods",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Pod CPU Usage (top 15)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "topk(15, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\"}[5m])))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pod Memory Usage (top 15)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "topk(15, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\", container!=\"POD\"}))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Pod Restarts (last 1h, by namespace)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h])) > 0",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Pods by Phase",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (phase) (kube_pod_status_phase) > 0",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": { "graphMode": "none", "colorMode": "value" }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["observability", "infra"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Host & Pod Stats",
      "uid": "host-pod-stats",
      "version": 1,
      "weekStart": ""
    }
  disk-usage.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Volumes (PVCs)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "PVC Usage %",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "PVC Usage % (trend)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "type": "table",
          "title": "PVCs — Used / Capacity",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kubelet_volume_stats_used_bytes",
              "format": "table",
              "instant": true,
              "refId": "Used"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kubelet_volume_stats_capacity_bytes",
              "format": "table",
              "instant": true,
              "refId": "Capacity"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 5,
          "type": "row",
          "title": "Host Filesystems",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Host Filesystem Usage %",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - ((node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"}) * 100)",
              "legendFormat": "{{instance}} {{mountpoint}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Host Filesystem Usage % (trend)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 - ((node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"}) * 100)",
              "legendFormat": "{{instance}} {{mountpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 8,
          "type": "text",
          "title": "Alertas",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 28 },
          "options": {
            "mode": "markdown",
            "content": "Alertas provisionados no Grafana (Alerting → Alert rules, pasta \"Observability\"): **PVC usage >= 80%** e **Host filesystem usage >= 80%**, um disparo por volume/mountpoint que cruzar o limite. Sem canal de notificação externo configurado ainda (email/Slack/webhook) — o estado de disparo fica visível na UI do Grafana."
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["observability", "infra", "disk"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Disk Usage",
      "uid": "disk-usage",
      "version": 1,
      "weekStart": ""
    }
  api-request-latency-percentiles.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Latência p50 por API",
          "description": "Metade das requisições concluiu em até este tempo.",
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by (le, service, span_name) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_name=~\"$span_name\"}[$__rate_interval])))",
              "legendFormat": "{{service}} · {{span_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latência p85 por API",
          "description": "85% das requisições concluiu em até este tempo.",
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.85, sum by (le, service, span_name) (rate(traces_spanmetrics_latency_bucket{service=~\"$service\", span_name=~\"$span_name\"}[$__rate_interval])))",
              "legendFormat": "{{service}} · {{span_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": {}
        },
        {
          "id": 3,
