deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
    # Default (4MB/s, ~6MB burst) é baixo demais para o catch-up inicial do
    # Alloy lendo o backlog de todos os pods do cluster de uma vez — causou
    # "ingestion rate limit exceeded" logo no primeiro deploy.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn-fast
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Sem isso o chart valida e falha: read/write/backend (modo SimpleScalable)
# default para 3 réplicas cada, mesmo com deploymentMode: SingleBinary.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

test:
  enabled: false
lokiCanary:
  enabled: false
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
