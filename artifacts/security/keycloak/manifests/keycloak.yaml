apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
      name: http
  selector:
    app: keycloak
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: keycloak
  name: keycloak-discovery
spec:
  selector:
    app: keycloak
  clusterIP: None
  type: ClusterIP
---
apiVersion: apps/v1
# Use a stateful setup to ensure that for a rolling update Pods are restarted with a rolling strategy one-by-one.
# This prevents losing in-memory information stored redundantly in two Pods.
kind: StatefulSet
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  serviceName: keycloak-discovery
  # Run with one replica to save resources, or with two replicas to allow for rolling updates for configuration changes
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4
          args: ["start", "--verbose", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            # In a production environment, add a TLS certificate to Keycloak to either end-to-end encrypt the traffic between
            # the client or Keycloak, or to encrypt the traffic between your proxy and Keycloak.
            # Respect the proxy headers forwarded by the reverse proxy
            # In a production environment, verify which proxy type you are using, and restrict access to Keycloak
            # from other sources than your proxy if you continue to use proxy headers.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            # In this explorative setup, no strict hostname is set.
            # For production environments, set a hostname for a secure setup.
            # Single host for the issuer and the Admin Console: the console loads keycloak-js against
            # this URL, and a different admin host makes its 3rd-party cookie check iframe cross-site
            # (timeout). /admin is only routed on the websecure entrypoint (keycloak-admin Ingress), so
            # it is reachable from the LAN but not through the Cloudflare Tunnel (port 80).
            - name: KC_HOSTNAME
              value: "https://keycloak.blogdoft.dev"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: 'KC_CACHE'
              value: 'ispn'
            # Passing the Pod's IP primary address to the JGroups clustering as this is required in IPv6 only setups
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Instruct JGroups which DNS hostname to use to discover other Keycloak nodes
            # Needs to be unique for each Keycloak cluster
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              value: '$(POD_IP)'
            - name: KC_DB_URL
              value: 'jdbc:postgresql://192.168.1.212/kc-cluster'
            # - name: 'KC_DB_URL_DATABASE'
            #   value: 'keycloak'
            # - name: 'KC_DB_URL_HOST'
            #   value: 'postgres'
            - name: 'KC_DB'
              value: 'postgres'
            # In a production environment, use a secret to store username and password to the database
            - name: 'KC_DB_PASSWORD'
              valueFrom:
                secretKeyRef:
                  name: keycloak-database-secret
                  key: KC_DB_PASSWORD
            - name: 'KC_DB_USERNAME'
              valueFrom:
                secretKeyRef:
                  name: keycloak-database-secret
                  key: KC_DB_USERNAME
          volumeMounts:
            - name: keycloak-realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: keycloak-blogdoft-login-theme
              mountPath: /opt/keycloak/themes/blogdoft/login
              readOnly: true
            - name: keycloak-service-management-login-theme
              mountPath: /opt/keycloak/themes/service-management/login
              readOnly: true
            - name: keycloak-corta-login-theme
              mountPath: /opt/keycloak/themes/corta/login
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            periodSeconds: 1
            failureThreshold: 600              
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3              
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 10
            failureThreshold: 3              
          resources:
            limits:
              cpu: 1000m
              memory: 1500Mi
            requests:
              cpu: 250m
              memory: 1090Mi

      volumes:
        - name: keycloak-realm-import
          configMap:
            name: keycloak-realm-import
        - name: keycloak-blogdoft-login-theme
          configMap:
            name: keycloak-blogdoft-login-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: terminal.css
                path: resources/css/terminal-v4.css
              - key: template.ftl
                path: template.ftl
        - name: keycloak-service-management-login-theme
          configMap:
            name: keycloak-service-management-login-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: login.css
                path: resources/css/login.css
              - key: messages_en.properties
                path: messages/messages_en.properties
              - key: messages_pt_BR.properties
                path: messages/messages_pt_BR.properties
        - name: keycloak-corta-login-theme
          configMap:
            name: keycloak-corta-login-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: corta.css
                path: resources/css/corta.css
              - key: ofl-baloo2.txt
                path: resources/fonts/OFL-LICENSE-Baloo2.txt
              - key: ofl-nunito.txt
                path: resources/fonts/OFL-LICENSE-Nunito.txt
              - key: icon.svg
                path: resources/img/corta-icon.svg
              - key: logo-dark.svg
                path: resources/img/corta-logo-dark.svg
              - key: logo.svg
                path: resources/img/corta-logo.svg
              - key: baloo700.woff2
                path: resources/fonts/baloo-2-latin-700-normal.woff2
              - key: nunito400.woff2
                path: resources/fonts/nunito-latin-400-normal.woff2
              - key: nunito600.woff2
                path: resources/fonts/nunito-latin-600-normal.woff2
              - key: nunito700.woff2
                path: resources/fonts/nunito-latin-700-normal.woff2
              - key: nunito800.woff2
                path: resources/fonts/nunito-latin-800-normal.woff2
              - key: favicon.ico
                path: resources/img/favicon.ico

