# Login theme of the Corta! (saas) client in the k8s realm. Source of truth: corta repo,
# .eng/docker/keycloak/theme/corta/login - keep both in sync. Item keys are short on purpose
# (long file-like names after `key:` trip the gitleaks generic-api-key rule); `path` keeps the real file name.
apiVersion: v1
data:
  theme.properties: |
    # Tema de login Corta! (identidade em specs/18-identidade-visual.md). Estende o keycloak.v2 e só troca estilo e marca.
    parent=keycloak.v2
    styles=css/styles.css css/corta.css
    # segue prefers-color-scheme do navegador; as cores escuras da marca estão em corta.css
    darkMode=true
  corta.css: |
    /* Corta! — tema de login do Keycloak. Cores e fontes espelham frontend/src/app/core/theme/cabeleiro-preset.ts e _brand.scss. */
    @font-face { font-family: 'Nunito'; font-weight: 400; font-display: swap; src: url('../fonts/nunito-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Nunito'; font-weight: 600; font-display: swap; src: url('../fonts/nunito-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Nunito'; font-weight: 700; font-display: swap; src: url('../fonts/nunito-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Nunito'; font-weight: 800; font-display: swap; src: url('../fonts/nunito-latin-800-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Baloo 2'; font-weight: 700; font-display: swap; src: url('../fonts/baloo-2-latin-700-normal.woff2') format('woff2'); }

    :root {
        --corta-primary: #c93428; /* primary.700: 5,2:1 com branco */
        --corta-primary-hover: #a32a21;
        --corta-peach: #ffe2d6;
        --corta-cream: #fff7f3;
        --corta-wine: #3d1f2e;
        --corta-muted: #6f5560;
        --corta-surface: #fff;
        --corta-border: #e4c9bf;
        --corta-border-hover: #94787f;
        --corta-link: var(--corta-primary);
        --corta-link-hover: var(--corta-primary-hover);
        --corta-shadow: rgba(61, 31, 46, 0.12);
        --corta-focus-ring: rgba(201, 52, 40, 0.18);
        color-scheme: light;

        --keycloak-bg-logo-url: none;
        --keycloak-card-top-color: var(--corta-primary);

        --pf-v5-global--FontFamily--text: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --pf-v5-global--FontFamily--heading: 'Baloo 2', 'Nunito', system-ui, sans-serif;
        --pf-v5-global--FontFamily--sans-serif: var(--pf-v5-global--FontFamily--text);
        --pf-v5-global--Color--100: var(--corta-wine);
        --pf-v5-global--Color--200: var(--corta-muted);
        --pf-v5-global--primary-color--100: var(--corta-primary);
        --pf-v5-global--primary-color--200: var(--corta-primary-hover);
        --pf-v5-global--active-color--100: var(--corta-primary);
        --pf-v5-global--link--Color: var(--corta-link);
        --pf-v5-global--link--Color--hover: var(--corta-link-hover);
        --pf-v5-global--BorderColor--100: var(--corta-border);
    }

    .login-pf body {
        background: linear-gradient(160deg, var(--corta-cream) 0%, var(--corta-peach) 100%) fixed;
        color: var(--corta-wine);
    }

    /* marca no lugar do nome do realm */
    .pf-v5-c-login__header { justify-content: center; }

    #kc-header-wrapper.pf-v5-c-brand {
        display: block;
        width: 100%;
        height: 5.5rem;
        font-size: 0; /* o nome continua no DOM para leitores de tela */
        background: url('../img/corta-logo.svg') center / contain no-repeat;
    }

    #kc-header::after {
        content: 'Seu salão organizado, sem complicação.';
        display: block;
        margin: 0.75rem 0 1.25rem;
        text-align: center;
        font-family: 'Baloo 2', 'Nunito', sans-serif;
        font-size: 1.1rem;
        color: var(--corta-wine);
    }

    /* cartão no estilo do Sakai: cantos grandes e sombra suave */
    .pf-v5-c-login__main {
        border-radius: 1.5rem;
        overflow: hidden;
        background: var(--corta-surface);
        box-shadow: 0 10px 40px var(--corta-shadow);
    }

    .pf-v5-c-login__main-header { border-top: 6px solid var(--corta-primary); }

    .pf-v5-c-login__main-header .pf-v5-c-title {
        font-family: 'Baloo 2', 'Nunito', sans-serif;
        font-weight: 700;
        color: var(--corta-wine);
    }

    /* campos: uma única borda fina e arredondada (o PatternFly desenha borda no contêiner, outra no input e uma linha azul no foco) */
    .pf-v5-c-form-control {
        --pf-v5-c-form-control--BorderColor: transparent;
        --pf-v5-c-form-control--BorderTopColor: transparent;
        --pf-v5-c-form-control--BorderRightColor: transparent;
        --pf-v5-c-form-control--BorderBottomColor: transparent;
        --pf-v5-c-form-control--BorderLeftColor: transparent;
        --pf-v5-c-form-control--hover--BorderBottomColor: transparent;
        --pf-v5-c-form-control--focus--BorderBottomColor: transparent;
        border-radius: 0.75rem;
        background-color: var(--corta-surface);
    }

    .pf-v5-c-form-control::before { border: 1px solid var(--corta-border); border-radius: 0.75rem; }

    .pf-v5-c-form-control::after { display: none; }

    .pf-v5-c-form-control:hover::before { border-color: var(--corta-border-hover); }

    .pf-v5-c-form-control:focus-within::before { border-color: var(--corta-primary); box-shadow: 0 0 0 3px var(--corta-focus-ring); }

    .pf-v5-c-form-control > input, .pf-v5-c-form-control input:focus { border: 0; outline: none; box-shadow: none; background: transparent; }

    /* senha: campo e botão de exibir formam uma peça só */
    .pf-v5-c-input-group { gap: 0; }

    /* o tema escuro do PatternFly separa os itens do grupo com uma borda cinza e sobrepõe 1px */
    .pf-v5-c-input-group > * + * { border-inline-start: 0; margin-inline-start: 0; }

    .pf-v5-c-input-group__item.pf-m-fill .pf-v5-c-form-control { border-top-right-radius: 0; border-bottom-right-radius: 0; }

    .pf-v5-c-input-group__item.pf-m-fill .pf-v5-c-form-control::before { border-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }

    .pf-v5-c-button.pf-m-control {
        background: var(--corta-surface);
        border: 0;
        border-radius: 0 0.75rem 0.75rem 0;
        color: var(--corta-muted);
        box-shadow: inset 0 1px 0 var(--corta-border), inset 0 -1px 0 var(--corta-border), inset -1px 0 0 var(--corta-border);
    }

    .pf-v5-c-input-group:hover .pf-v5-c-form-control::before { border-color: var(--corta-border-hover); }

    .pf-v5-c-input-group:hover .pf-v5-c-button.pf-m-control {
        box-shadow: inset 0 1px 0 var(--corta-border-hover), inset 0 -1px 0 var(--corta-border-hover), inset -1px 0 0 var(--corta-border-hover);
    }

    .pf-v5-c-input-group:focus-within .pf-v5-c-form-control::before { border-color: var(--corta-primary); }

    .pf-v5-c-input-group:focus-within .pf-v5-c-button.pf-m-control {
        box-shadow: inset 0 1px 0 var(--corta-primary), inset 0 -1px 0 var(--corta-primary), inset -1px 0 0 var(--corta-primary);
    }

    /* o anel de foco envolve o grupo inteiro, não só o campo */
    .pf-v5-c-input-group__item.pf-m-fill .pf-v5-c-form-control:focus-within::before { box-shadow: none; }

    .pf-v5-c-input-group:focus-within { border-radius: 0.75rem; box-shadow: 0 0 0 3px var(--corta-focus-ring); }

    .pf-v5-c-button.pf-m-control::after { display: none; }

    .pf-v5-c-button.pf-m-primary {
        border-radius: 0.75rem;
        font-weight: 700;
        min-height: 2.75rem;
        --pf-v5-c-button--m-primary--BackgroundColor: var(--corta-primary);
        --pf-v5-c-button--m-primary--hover--BackgroundColor: var(--corta-primary-hover);
        --pf-v5-c-button--m-primary--focus--BackgroundColor: var(--corta-primary-hover);
        --pf-v5-c-button--m-primary--active--BackgroundColor: var(--corta-primary-hover);
    }

    /* secundário (ex.: "Sign in with Passkey"): mesmo molde do primário, contornado; --corta-link tem contraste nos dois temas */
    .pf-v5-c-button.pf-m-secondary {
        border-radius: 0.75rem;
        font-weight: 700;
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--corta-link);
        --pf-v5-c-button--m-secondary--Color: var(--corta-link);
        --pf-v5-c-button--m-secondary--hover--Color: var(--corta-link-hover);
        --pf-v5-c-button--m-secondary--focus--Color: var(--corta-link-hover);
        --pf-v5-c-button--m-secondary--active--Color: var(--corta-link-hover);
        --pf-v5-c-button--m-secondary--BorderColor: var(--corta-link);
        --pf-v5-c-button--m-secondary--hover--BorderColor: var(--corta-link-hover);
        --pf-v5-c-button--m-secondary--focus--BorderColor: var(--corta-link-hover);
        --pf-v5-c-button--m-secondary--active--BorderColor: var(--corta-link-hover);
    }

    .pf-v5-c-button.pf-m-secondary::after { border-radius: 0.75rem; border-color: var(--corta-link); }

    .pf-v5-c-button.pf-m-secondary:hover, .pf-v5-c-button.pf-m-secondary:focus {
        background: var(--corta-peach);
        color: var(--corta-link-hover);
    }

    .pf-v5-c-button.pf-m-secondary:hover::after, .pf-v5-c-button.pf-m-secondary:focus::after { border-color: var(--corta-link-hover); }

    .pf-v5-c-button:focus-visible { outline: 2px solid var(--corta-primary); outline-offset: 2px; }

    @media (max-width: 576px) {
        .pf-v5-c-login__container { grid-template-columns: 1fr; padding: 0 0.5rem; }
    }

    /* segue o tema do navegador; o botão primário mantém o fundo da marca (texto branco, 5,2:1) */
    @media (prefers-color-scheme: dark) {
        :root, :root.pf-v5-theme-dark {
            --corta-peach: #3d1f2e;
            --corta-cream: #24121b;
            --corta-wine: #fbe9e1;
            --corta-muted: #d9bfc3;
            --corta-surface: #33202a;
            --corta-border: #6b4a58;
            --corta-border-hover: #b89aa3;
            --corta-link: #ff9d8f;
            --corta-link-hover: #ffc2b8;
            --corta-shadow: rgba(0, 0, 0, 0.5);
            --corta-focus-ring: rgba(255, 157, 143, 0.35);
            color-scheme: dark;
        }

        .pf-v5-c-form-control > input { color: var(--corta-wine); }

        #kc-header-wrapper.pf-v5-c-brand { background-image: url('../img/corta-logo-dark.svg'); }
    }
