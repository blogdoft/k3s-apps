# Public exposure through the Cloudflare Tunnel. Only the OIDC endpoints (/realms) and static assets
# (/resources) are routed here; keycloak.blogdoft.dev is the only hostname Keycloak answers on.
# The Admin Console is the keycloak-admin Ingress below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
    external-dns.kubernetes.io/target: 86135bb0-558c-46c8-b4a3-6ac8679cc0d2.cfargotunnel.com
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - keycloak.blogdoft.dev
      secretName: keycloak-blogdoft-dev-tls
  rules:
    - host: keycloak.blogdoft.dev
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# Admin Console on the issuer host, restricted to the websecure entrypoint. The tunnel only forwards to
# Traefik's port 80 (web entrypoint), so /admin is unreachable from the internet. LAN clients need
# keycloak.blogdoft.dev to resolve to the Traefik IP (internal DNS / hosts) to reach it on 443.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.blogdoft.dev
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
