apiVersion: v1
kind: ConfigMap
metadata:
  name: kafbat-ui-config
  namespace: kafka-ui
data:
  dynamic_config.yaml: |
    # (vazio) - corresponde ao ./kui/config.yaml atual
  auth.yaml: |
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            provider: keycloak
            client-name: keycloak
            clientId: kafka-ui
            clientSecret: ${OIDC_CLIENT_SECRET}
            scope: openid
            issuer-uri: https://keycloak.blogdoft.dev/realms/k8s
            user-name-attribute: preferred_username
            redirect-uri: https://kafka-ui.home.arpa/login/oauth2/code/keycloak
            custom-params:
              type: oauth
              roles-field: groups
    rbac:
      roles:
        - name: admins
          clusters:
            - local
          subjects:
            - provider: oauth
              type: role
              value: KafkaUiAdmins
          permissions:
            - resource: applicationconfig
              actions: all
            - resource: clusterconfig
              actions: all
            - resource: topic
              value: ".*"
              actions: all
            - resource: consumer
              value: ".*"
              actions: all
            - resource: schema
              value: ".*"
              actions: all
            - resource: connect
              value: ".*"
              actions: all
            - resource: ksql
              actions: all
            - resource: acl
              actions: all
            - resource: audit
              actions: all
        - name: viewers
          clusters:
            - local
          subjects:
            - provider: oauth
              type: role
              value: KafkaUiViewers
          permissions:
            - resource: clusterconfig
              actions: [ view ]
            - resource: topic
              value: ".*"
              actions: [ view ]
            - resource: consumer
              value: ".*"
              actions: [ view ]
            - resource: schema
              value: ".*"
              actions: [ view ]
            - resource: connect
              value: ".*"
              actions: [ view ]
            - resource: acl
              actions: [ view ]
            - resource: audit
              actions: [ view ]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  namespace: kafka-ui
  labels:
    app: kafbat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
        - name: kafbat-ui
          image: ghcr.io/kafbat/kafka-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "local"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_CLUSTERS_0_METRICS_PORT
              value: "9997"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED
              value: "true"
            - name: KAFKA_CLUSTERS_0_AUDIT_CONSOLEAUDITENABLED
              value: "true"
            - name: SPRING_CONFIG_ADDITIONAL-LOCATION
              value: /etc/kafkaui/auth.yaml
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kafka-ui-oidc
                  key: client-secret
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx320m"
          resources:
            limits:
              memory: "536Mi"
            requests:
              memory: "128Mi"
          volumeMounts:
            - name: kafbat-ui-config
              mountPath: /etc/kafkaui/dynamic_config.yaml
              subPath: dynamic_config.yaml
            - name: kafbat-ui-config
              mountPath: /etc/kafkaui/auth.yaml
              subPath: auth.yaml
      volumes:
        - name: kafbat-ui-config
          configMap:
            name: kafbat-ui-config

---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  namespace: kafka-ui
  labels:
    app: kafbat-ui
spec:
  selector:
    app: kafbat-ui
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: kafka-ui
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafbat-ui
  namespace: kafka-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kafka-ui-redirect-to-https@kubernetescrd
    cert-manager.io/cluster-issuer: home-arpa-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kafka-ui.home.arpa
      secretName: kafka-ui-tls
  rules:
    - host: kafka-ui.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafbat-ui
                port:
                  number: 8081
