apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: 86135bb0-558c-46c8-b4a3-6ac8679cc0d2
    credentials-file: /etc/cloudflared/credentials/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # O Host header original é preservado e o Traefik escolhe o Ingress correto.
      - hostname: "*.blogdoft.dev"
        service: http://traefik.kube-system.svc.cluster.local:80
      # O wildcard não cobre o domínio raiz (blogdoft.dev).
      - hostname: "blogdoft.dev"
        service: http://traefik.kube-system.svc.cluster.local:80
      # Regra obrigatória: qualquer hostname não autorizado recebe 404.
      - service: http_status:404
