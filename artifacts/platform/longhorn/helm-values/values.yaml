# The Ingress is not rendered by the chart: it is hand-written in manifests/oauth2-proxy.yaml so that
# it routes through oauth2-proxy (Keycloak login) instead of straight to longhorn-frontend.
ingress:
  enabled: false

persistence:
  defaultClass: true 
  defaultClassReplicaCount: 1
  defaultDiskSelector:
    enable: true
    selector: "ssd"
  defaultNodeSelector:
    enable: true
    selector: "ssd"

defaultSettings:
  defaultDataPath: "/storage01"

service:
  ui:
    type: "ClusterIP"
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false

csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 0

longhornManager:
  log:
    format: "json"

lonhornDriver:
  log:
    format: "json"
