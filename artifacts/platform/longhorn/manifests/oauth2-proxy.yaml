# Keycloak login in front of the Longhorn UI, which has no authentication of its own. oauth2-proxy
# is the reverse proxy for longhorn.home.arpa: it signs users in at Keycloak and only forwards
# members of LonghornAdmins to longhorn-frontend. The Ingress is here (not in the chart render) so
# it can point at the proxy instead of the UI. The oauth2-proxy-secrets Secret is created
# outside Git by k3s-experiment (longhorn/install.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: longhorn-system
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: "oidc"
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: "https://keycloak.blogdoft.dev/realms/k8s"
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: "https://longhorn.home.arpa/oauth2/callback"
            - name: OAUTH2_PROXY_SCOPE
              value: "openid profile email groups"
            - name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
              value: "groups"
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              value: "LonghornAdmins"
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: "0.0.0.0:4180"
            - name: OAUTH2_PROXY_UPSTREAMS
              value: "http://longhorn-frontend.longhorn-system.svc.cluster.local:80/"
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_PASS_HOST_HEADER
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: ".home.arpa"
            - name: OAUTH2_PROXY_AUTH_LOGGING
              value: "true"
            - name: OAUTH2_PROXY_STANDARD_LOGGING
              value: "true"
            - name: OAUTH2_PROXY_CLIENT_ID
              value: "longhorn"
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: longhorn-system
spec:
  type: ClusterIP
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: home-arpa-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - longhorn.home.arpa
      secretName: longhorn-tls
  rules:
    - host: longhorn.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
