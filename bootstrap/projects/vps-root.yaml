apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vps-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Root of the vps-apps App of Apps; may only create Applications/AppProjects in argocd on morgul
  sourceRepos:
    - git@github.com:blogdoft/vps-apps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
