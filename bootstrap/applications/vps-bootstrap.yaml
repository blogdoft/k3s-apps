apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vps-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  project: vps-root
  source:
    repoURL: git@github.com:blogdoft/vps-apps.git
    path: bootstrap
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
