title = "k3s-apps gitleaks config"

# Keep the upstream rules (AWS, GitHub, private keys, generic-api-key, ...) and add the ones that
# matter for a GitOps repo: Kubernetes manifests, Helm output and Cloudflare credentials.
[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token (cert-manager DNS-01, external-dns)"
regex = '''(?i)(?:cloudflare|cf_api_token|api-token|api_token)["'\s:=]{1,6}([A-Za-z0-9_-]{40})\b'''
secretGroup = 1
keywords = ["cloudflare", "cf_api_token", "api-token", "api_token"]

[[rules]]
id = "cloudflared-tunnel-secret"
description = "cloudflared credentials.json (TunnelSecret)"
regex = '''"TunnelSecret"\s*:\s*"([A-Za-z0-9+/=]{30,})"'''
secretGroup = 1
keywords = ["tunnelsecret"]

[[rules]]
id = "k8s-secret-base64-private-key"
description = "Base64-encoded private key inside a Kubernetes Secret (tls.key, ca key, ...)"
regex = '''LS0tLS1CRUdJTi(?:BQUklWQVRFIEtFW|BSU0EgUFJJVkFURSBLRV|BFQyBQUklWQVRFIEtF|BPUEVOU1NIIFBSSVZBVEUgS0VZ)[A-Za-z0-9+/=]{20,}'''
keywords = ["ls0tls1crgjtt"]

[[rules]]
id = "k8s-inline-env-secret"
description = "Literal value for a PASSWORD/SECRET/TOKEN/API_KEY env var; use secretKeyRef instead"
regex = '''(?i)name:\s*["']?[A-Z0-9_]*(?:PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|PRIVATE_KEY)[A-Z0-9_]*["']?\s*\n\s*value:\s*["']?([^\s"'$<{][^\s"']{7,})'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "secret", "token", "apikey", "api_key", "private_key"]

[[rules]]
id = "k8s-secret-data-literal"
description = "Literal value under data:/stringData: of a Secret; create Secrets outside Git (see each app's readme)"
regex = '''(?m)^(?:data|stringData):[ \t]*\n(?:[ \t]+#[^\n]*\n)*[ \t]+[\w.-]+:[ \t]*["']?([A-Za-z0-9+/=_-]{20,})["']?[ \t]*$'''
secretGroup = 1
entropy = 3.5
keywords = ["stringdata:", "data:"]

[[rules]]
id = "redis-requirepass-literal"
description = "Literal password passed to redis via --requirepass"
regex = '''(?i)--requirepass["',\s]+["']?([^\s"'$<{][^\s"']{7,})'''
secretGroup = 1
keywords = ["requirepass"]

[[rules]]
id = "sensitive-file"
description = "File that must never be committed (.env, credentials.json, kubeconfig, private keys)"
path = '''(?i)(^|/)(\.env(\.(local|dev|prod|production|staging))?|credentials\.json|kubeconfig[^/]*|id_(rsa|ed25519|ecdsa)|[^/]+\.(pem|key|p12|pfx|jks))$'''

[[allowlists]]
description = "Placeholders and template markers"
regexes = [
  '''<[^>\s]+>''',
  '''\$\{[A-Z0-9_]+\}''',
  '''(?i)changeme|REDACTED|example|placeholder''',
]

# Documented exception (see CLAUDE.md "Secrets"): the redis password is inline in the manifest.
# Scoped to this rule and file so any other literal password still blocks the commit.
[[allowlists]]
description = "Known redis inline password"
targetRules = ["redis-requirepass-literal", "generic-api-key"]
paths = ['''artifacts/databases/redis/apply\.yaml''']
